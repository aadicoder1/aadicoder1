name: Generate Metrics

on:
  schedule:
    - cron: "0 */6 * * *"    # runs every 6 hours
  workflow_dispatch:           # lets you trigger it manually from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: aadicoder1
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics.isocalendar.svg
          committer_branch: output
          committer_message: "chore: update isometric calendar"
          output_action: commit
